<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  
  <!-- ========== PWA & UWP 支持（新增） ========== -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b4c6e">
  <meta name="msapplication-TileColor" content="#1b4c6e">
  <meta name="msapplication-TileImage" content="img/favicon-192.png">
  <meta name="application-name" content="Unlimited Waifu2x">
  <!-- ========================================= -->

  <link rel="icon" href="favicon.ico">
  <title>Unlimited Waifu2x</title>
  <link href="css/Inter.css" rel="stylesheet">
  <script src="js/jquery.min.js"></script>
  <script src="js/jquery.cookie.js"></script>
  <script src="js/ort.min.js"></script>
  <script src="js/script.js" charset="utf-8"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f4f7fb;
      color: #1e293b;
      line-height: 1.5;
      padding: 1.5rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .app-container {
      max-width: 1600px;
      width: 100%;
    }
    h1 {
      font-weight: 600;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      background: linear-gradient(145deg, #0f2b3d, #1e4b6e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.25rem;
      text-align: center;
    }
    .subhead {
      text-align: center;
      font-size: 0.95rem;
      color: #475569;
      margin-bottom: 1.8rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
    }
    .lang-switch {
      display: flex;
      gap: 0.5rem;
      margin-left: 0.5rem;
    }
    .lang-switch button {
      background: #e9ecf3;
      border: 1px solid #cbd5e1;
      border-radius: 30px;
      padding: 0.2rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1e3a5f;
      cursor: pointer;
      transition: 0.1s;
    }
    .lang-switch button:hover {
      background: #d0ddee;
      border-color: #7b9ab9;
    }
    .lang-switch button.active {
      background: #1b4c6e;
      color: white;
      border-color: #1b4c6e;
    }

    #main-panel {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      background: transparent;
      margin: 1rem 0 1.5rem;
    }
    .previews-col {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      width: 100%;
    }
    .settings-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    #src-box, #dest-box {
      background: white;
      border-radius: 28px;
      box-shadow: 0 20px 35px -12px rgba(0,20,40,0.2), 0 2px 8px rgba(0,0,0,0.03);
      padding: 1.5rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      border: 1px solid #ffffff50;
      backdrop-filter: blur(2px);
      width: 100%;
    }
    .box-label {
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #4b6584;
      margin-bottom: 0.75rem;
      display: block;
    }
    #src, #dest {
      border-radius: 18px;
      background: #f0f4fa;
      box-shadow: inset 0 2px 6px #00000010, 0 4px 12px #0000000c;
      transition: all 0.2s;
      display: block;
      object-fit: contain;
      min-height: 160px;
      max-width: 100%;
      max-height: 420px;
      width: auto;
      height: auto;
      background-image: linear-gradient(45deg, #d9e2ec 25%, transparent 25%),
                        linear-gradient(-45deg, #d9e2ec 25%, transparent 25%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px;
    }
    #src {
      cursor: pointer;
    }
    #dest {
      background: #f0f4fa;
      cursor: pointer;
    }
    #form-box {
      background: #ffffffdd;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 40px -18px #1e293b40, 0 8px 20px -8px #00000010;
      width: 100%;
    }
    #form-box table {
      width: 100%;
      border-collapse: collapse;
    }
    #form-box tbody {
      display: block;
    }
    #form-box tr {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1.2rem;
      gap: 0.5rem 1rem;
      border-bottom: 1px dashed #dde7f0;
      padding-bottom: 0.8rem;
    }
    #form-box tr:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    #form-box td:first-child {
      font-weight: 550;
      color: #1e3a5f;
      min-width: 150px;
      font-size: 1rem;
      letter-spacing: -0.01em;
      background: #ecf3f9;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      width: auto;
      box-shadow: inset 0 1px 3px #ffffff, 0 2px 4px #00000008;
      flex-wrap: wrap;
    }
    #form-box td:last-child {
      flex: 1;
      min-width: 200px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
    }
    select, input[type="file"], input[type="checkbox"] {
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 40px;
      padding: 0.55rem 1.2rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: #0f2b3d;
      transition: 0.15s;
      cursor: pointer;
      box-shadow: 0 2px 4px #00000008;
    }
    input[type="file"] {
      max-width: 100%;
      flex: 1 1 auto;
      white-space: normal;
      word-break: keep-all;
    }
    select {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2334495e" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>');
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1.2rem;
      appearance: none;
      -webkit-appearance: none;
      padding-right: 2.8rem;
    }
    .comment {
      font-size: 0.85rem;
      color: #6d8aac;
      background: #e8f0fe;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      white-space: nowrap;
    }
    .model-help-btn {
      background: #eef2f8;
      border: 1px solid #cbd5e1;
      border-radius: 40px;
      padding: 0.35rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      color: #1e3a5f;
      cursor: pointer;
      transition: 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      white-space: nowrap;
    }
    .model-help-btn:hover {
      background: #e2eaf2;
      transform: scale(0.97);
      border-color: #8fadcc;
    }
    #button-box {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }
    #start, #stop {
      border: none;
      background: #1b4c6e;
      color: white;
      font-weight: 550;
      font-size: 1.2rem;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 8px 18px -8px #0f2b3d70;
      letter-spacing: 0.01em;
      border: 1px solid #ffffff30;
    }
    #stop {
      background: #a0b8cc;
      color: #1e2f40;
      box-shadow: 0 4px 12px #0000001a;
    }
    #progress-bar {
      width: 100%;
      height: 12px;
      border-radius: 30px;
      background-color: #e2e8f0;
      border: none;
      overflow: hidden;
      display: none;
    }
    #progress-bar::-webkit-progress-bar {
      background-color: #e2e8f0;
      border-radius: 30px;
    }
    #progress-bar::-webkit-progress-value {
      background: linear-gradient(90deg, #4b9fd1, #236b97);
      border-radius: 30px;
      transition: width 0.2s;
    }
    #progress-bar::-moz-progress-bar {
      background: linear-gradient(90deg, #4b9fd1, #236b97);
      border-radius: 30px;
    }
    #message {
      background: #eef4fa;
      border-radius: 60px;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 450;
      color: #1a3d62;
      border: 1px solid #ffffff;
      box-shadow: 0 2px 10px #0000000c;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }
    #footer {
      margin-top: 3rem;
      padding: 2rem 1rem 1rem;
      border-top: 2px solid #d0e0ee;
      text-align: center;
      color: #4b6584;
      font-size: 0.95rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem 3rem;
    }
    #footer a {
      color: #1d4e7c;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px dotted #9bb7d4;
    }
    .model-help-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      backdrop-filter: blur(3px);
    }
    .model-help-card {
      background: #fff;
      border-radius: 28px;
      width: 90%;
      max-width: 860px;
      overflow: hidden;
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.35);
      animation: modalFadeIn 0.2s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-header {
      padding: 1.2rem 1.5rem 0.8rem;
      font-size: 1.4rem;
      font-weight: 600;
      border-bottom: 2px solid #eef2f6;
      color: #1f4e7a;
      background: #ffffff;
    }
    .modal-body {
      padding: 1.5rem;
      font-size: 0.95rem;
      color: #2c3e4e;
      line-height: 1.5;
    }
    .model-help-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
    }
    .model-help-table th,
    .model-help-table td {
      border: 1px solid #e2e8f0;
      padding: 0.8rem;
      text-align: left;
      vertical-align: top;
    }
    .model-help-table th {
      background: #f1f5f9;
      font-weight: 600;
      color: #1e3a5f;
    }
    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 0 1.5rem 1.5rem;
    }
    .modal-action-bottom {
      display: flex;
      gap: 0.8rem;
    }
    .modal-action-bottom button {
      flex: 1;
      background: #eef2f8;
      color: #1e3a5f;
      border: 1px solid #cbdde9;
      border-radius: 60px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }
    .modal-action-bottom button:hover {
      background: #e2eaf2;
    }
    
    /* ========== 桌面端 (≥900px) 优化布局 ========== */
    @media (min-width: 900px) {
      #main-panel {
        flex-direction: row;
        align-items: stretch;
        gap: 2rem;
      }
      .previews-col {
        flex: 1.1;
        max-width: 52%;
        min-width: 320px;
      }
      .settings-area {
        width: 680px;
        flex-shrink: 0;
        gap: 1.8rem;
      }
      #src, #dest {
        max-height: 420px;
        min-height: 200px;
      }
      #src-box, #dest-box {
        min-height: 280px;
      }
      .box-label {
        font-size: 1rem;
      }
      #form-box {
        padding: 2rem 2rem 2rem 2rem;
      }
      #form-box tbody {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem 2rem;
      }
      #form-box tr {
        display: block;
        margin: 0;
        padding: 0;
        border-bottom: none;
        background: transparent;
        border-right: 1px solid #dce5ef;
        padding-right: 1.2rem;
      }
      #form-box tr:nth-child(even) {
        border-right: none;
        padding-right: 0;
      }
      #form-box tr.full-width-row {
        grid-column: 1 / -1;
        border-right: none;
        padding-right: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.8rem 1.5rem;
        margin-top: 0.75rem;
        margin-bottom: 0.5rem;
        background: transparent;
      }
      #form-box tr.full-width-row td {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.8rem;
        width: auto;
      }
      #form-box tr:not(.full-width-row) td {
        display: block;
        width: 100%;
        padding: 0;
      }
      #form-box tr:not(.full-width-row) td:first-child {
        min-width: auto;
        width: fit-content;
        margin-bottom: 0.6rem;
        background: #ecf3f9;
        display: inline-flex;
        font-size: 0.95rem;
        padding: 0.4rem 1.2rem;
      }
      #form-box tr:not(.full-width-row) td:last-child {
        width: 100%;
        min-width: auto;
        flex-wrap: wrap;
        gap: 0.8rem;
      }
      #form-box select, #form-box input[type="file"] {
        width: 100%;
        max-width: 100%;
        padding: 0.7rem 1.2rem;
        font-size: 1rem;
      }
      #form-box label {
        font-size: 0.95rem;
      }
      .comment {
        white-space: normal;
        margin-top: 0.3rem;
        font-size: 0.85rem;
      }
      .full-width-row #button-box {
        justify-content: center;
        gap: 1.5rem;
        margin: 0.5rem 0;
      }
      #start, #stop {
        padding: 0.8rem 2.2rem;
        font-size: 1.2rem;
      }
      #progress-bar {
        margin-top: 0.25rem;
      }
      #message {
        padding: 1rem 2rem;
        font-size: 1.2rem;
      }
    }
    
    /* ========== 移动端深度修复 (≤899px) 完全重排队列，彻底解决错位 ========== */
    @media (max-width: 899px) {
      .settings-area {
        width: 100%;
      }
      #src, #dest {
        max-height: 280px;
        min-height: 140px;
      }
      /* 核心修复：将表单垂直化，避免标签与控件错位、溢出 */
      #form-box {
        padding: 1.2rem;
        width: 100%;
        overflow-x: hidden;
      }
      #form-box tbody {
        display: block;
        width: 100%;
      }
      #form-box tr {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
        margin-bottom: 1.4rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #e2edf7;
        background: transparent;
        width: 100%;
      }
      #form-box tr:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }
      /* 标签样式：去除复杂背景，清晰块级 */
      #form-box td:first-child {
        min-width: auto;
        width: 100%;
        background: transparent;
        padding: 0;
        box-shadow: none;
        border-radius: 0;
        font-weight: 600;
        font-size: 1rem;
        color: #1e3a5f;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.25rem;
      }
      /* 右侧控件区域：垂直排列，所有控件宽度自适应占满 */
      #form-box td:last-child {
        width: 100%;
        min-width: auto;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.6rem;
        flex: auto;
      }
      /* 所有输入类控件占满宽度，方便触屏 */
      #form-box select,
      #form-box input[type="file"],
      #form-box .comment,
      #form-box div[style*="flex"] {
        width: 100%;
        max-width: 100%;
      }
      /* 特殊处理下拉菜单和复选框等组合区（分块区域：随机顺序+下拉菜单+注释） */
      #form-box td:last-child > div {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        width: 100%;
      }
      /* 下拉框全宽 */
      #form-box select {
        width: 100%;
        padding: 0.7rem 2rem 0.7rem 1rem;
        font-size: 1rem;
      }
      /* 文件上传按钮显示清晰 */
      input[type="file"] {
        width: 100%;
        padding: 0.7rem 0.8rem;
        font-size: 0.9rem;
        white-space: normal;
        word-break: break-all;
      }
      /* 复选框区域保持内联但宽度自适应, 保证整行可点击 */
      label {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #f8fafd;
        padding: 0.5rem 0.8rem;
        border-radius: 40px;
        width: fit-content;
        border: 1px solid #dce5ef;
      }
      /* 注释块变成块级展示，信息清晰 */
      .comment {
        white-space: normal;
        width: auto;
        display: inline-block;
        text-align: center;
        margin-top: 0.2rem;
        background: #e6f0fa;
      }
      /* 模型帮助按钮在移动端大小适中 */
      .model-help-btn {
        padding: 0.3rem 0.8rem;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      /* 按钮区域全宽按钮组 */
      #button-box {
        flex-direction: row;
        justify-content: center;
        gap: 1rem;
        margin-top: 0.5rem;
        width: 100%;
      }
      #start, #stop {
        flex: 1;
        text-align: center;
        padding: 0.8rem 0.5rem;
        font-size: 1.1rem;
      }
      /* 进度条和消息框适应 */
      #progress-bar {
        width: 100%;
      }
      #message {
        font-size: 1rem;
        padding: 0.8rem 1rem;
      }
      /* 图片预览保持比例，不溢出 */
      #src-box, #dest-box {
        padding: 1rem;
      }
      /* 确保任何溢出隐藏 */
      .app-container {
        overflow-x: hidden;
      }
      /* 修正full-width-row 内td 在移动端表现，避免重复属性冲突 */
      .full-width-row td:last-child {
        display: flex;
        flex-direction: column;
        width: 100%;
      }
      /* 随机顺序复选框与下拉菜单分离时保持良好间距 */
      #form-box td:last-child select + label,
      #form-box td:last-child div > label {
        margin-top: 0.2rem;
      }
    }
    /* 针对非常小的手机（<400px）精细调整 */
    @media (max-width: 480px) {
      #form-box {
        padding: 1rem;
      }
      .model-help-btn {
        padding: 0.25rem 0.7rem;
        font-size: 0.7rem;
      }
      #start, #stop {
        font-size: 1rem;
        padding: 0.6rem 0.5rem;
      }
      .box-label {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
<div class="app-container">
  <h1 data-i18n="title">Unlimited Waifu2x</h1>
  <div class="subhead">
    <span data-i18n="subhead">⚡ 浏览器端二次元放大 · 完全本地处理</span>
    <div class="lang-switch">
      <button id="lang-zh" data-lang="zh" class="active">中文</button>
      <button id="lang-en" data-lang="en">English</button>
    </div>
  </div>

  <div id="main-panel">
    <div class="previews-col">
      <div id="src-box">
        <div class="box-label" data-i18n="src_label">🖼️ 原图</div>
        <img id="src" src="blank.png" alt="源图像">
      </div>
      <div id="dest-box">
        <div class="box-label" data-i18n="dest_label">✨ 输出</div>
        <canvas id="dest"></canvas>
      </div>
    </div>

    <div class="settings-area">
      <form id="form-box">
        <table>
          <tbody>
            <tr class="full-width-row">
              <td style="display: inline-flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                <span data-i18n="file_emoji_label">📂 文件</span><span>(<span data-i18n="drag_text">拖拽</span>)</span>
               </td>
               <td><input type="file" id="file" name="file" accept="image/*"></td>
            </tr>
            <tr>
              <td style="display: inline-flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                <span data-i18n="model_label">🧠 模型</span>
                <button type="button" id="modelHelpBtn" class="model-help-btn" data-i18n="model_help_btn">❓ 说明</button>
              </td>
              <td>
                <select name="model" style="flex: 1 1 auto;">
                  <option value="swin_unet.art" selected data-i18n="model_swin_art">🎨 swin_unet / 插画</option>
                  <option value="swin_unet.art_scan" data-i18n="model_swin_art_scan">🖨 swin_unet / 扫描插画</option>
                  <option value="swin_unet.photo" data-i18n="model_swin_photo">📷 swin_unet / 照片</option>
                  <option value="cunet.art" data-i18n="model_cunet_art">🎨 cunet / 插画</option>
                </select>
              </td>
            </tr>
            <tr>
              <td data-i18n="noise_label">🌀 降噪</td>
              <td><select name="noise_level">
                  <option value="-1" data-i18n="noise_none">(-) 无</option>
                  <option value="0" selected data-i18n="noise_low">(0) 低</option>
                  <option value="1" data-i18n="noise_med">(1) 中</option>
                  <option value="2" data-i18n="noise_high">(2) 高</option>
                  <option value="3" data-i18n="noise_highest">(3) 最高</option>
              </select></td>
            </tr>
            <tr>
              <td data-i18n="scale_label">🔍 放大</td>
              <td>
                <select name="scale">
                  <option value="1" data-i18n="scale_1">1倍</option>
                  <option value="2" selected data-i18n="scale_2">2倍</option>
                  <option value="4" data-i18n="scale_4">4倍</option>
                </select>
                <span id="scale-comment" class="comment" data-i18n="scale_comment">不支持4倍</span>
              </td>
            </tr>
            <tr>
              <td style="display: inline-flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                <span data-i18n="tile_label">🧩 分块</span>
                <label style="display: inline-flex; align-items: center; gap: 0.3rem; background: transparent; padding: 0; box-shadow: none;">
                  <input type="checkbox" name="tile_random"> <span data-i18n="tile_random">随机顺序</span>
                </label>
              </td>
              <td>
                <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;">
                  <select name="tile_size">
                    <option value="64">64</option>
                    <option value="256" selected>256</option>
                    <option value="400">400</option>
                    <option value="640">640</option>
                  </select>
                </div>
                <span id="tile-comment" class="comment" data-i18n="tile_comment">推荐256</span>
              </td>
            </tr>
            <tr>
              <td data-i18n="tta_label">🔄 测试增强 (TTA)</td>
              <td>
                <select name="tta"><option value="0" selected>0</option><option value="2">2</option><option value="4">4</option></select>
                <span style="color:#4b6584;" data-i18n="tta_integrated">集成</span>
              </td>
            </tr>
            <tr>
              <td data-i18n="alpha_label">🎭 透明通道</td>
              <td><select name="alpha"><option value="1" data-i18n="alpha_auto">自动</option><option value="0" selected data-i18n="alpha_disable">禁用</option></select></td>
            </tr>
            <tr class="full-width-row">
              <td colspan="2"><div id="button-box">
                  <input type="button" id="start" value="开始" data-i18n="start_btn">
                  <input type="button" id="stop" value="停止" data-i18n="stop_btn">
                </div></td>
            </tr>
          </tbody>
        </table>
      </form>

      <progress id="progress-bar" value="0" max="100"></progress>
      <div id="message" data-i18n="message_ready">( ・∀・) 准备就绪</div>
    </div>
  </div>

  <div id="footer">
    <div><span data-i18n="footer_based">基于</span><a href="https://github.com/nagadomi/nunif" id="external-github-link" target="_blank" rel="noopener" data-i18n="footer_link">nunif/waifu2x/unlimited_waifu2x 代码</a></div>
    <div><a href="privacy_policy.md" data-i18n="footer_privacy">隐私政策</a></div>
  </div>
</div>

<script>
  // ==================== 国际化 (完整模型说明) ====================
  const i18n = {
    zh: {
      title: "Unlimited Waifu2x", subhead: "⚡ 浏览器端二次元放大 · 完全本地处理",
      src_label: "🖼️ 原图", dest_label: "✨ 输出", file_emoji_label: "📂 文件", drag_text: "拖拽",
      model_label: "🧠 模型", noise_label: "🌀 降噪", scale_label: "🔍 放大", tile_label: "🧩 分块",
      tta_label: "🔄 测试增强 (TTA)", alpha_label: "🎭 透明通道",
      model_swin_art: "🎨 swin_unet / 插画", model_swin_art_scan: "🖨 swin_unet / 扫描插画",
      model_swin_photo: "📷 swin_unet / 照片", model_cunet_art: "🎨 cunet / 插画",
      noise_none: "(-) 无", noise_low: "(0) 低", noise_med: "(1) 中", noise_high: "(2) 高", noise_highest: "(3) 最高",
      scale_1: "1倍", scale_2: "2倍", scale_4: "4倍", tile_random: "随机顺序", tta_integrated: "集成",
      alpha_auto: "自动", alpha_disable: "禁用", start_btn: "开始", stop_btn: "停止",
      message_ready: "( ・∀・) 准备就绪", scale_comment: "不支持4倍", tile_comment: "推荐256",
      footer_based: "基于", footer_link: "nunif/waifu2x/unlimited_waifu2x 代码", footer_privacy: "隐私政策",
      model_help_btn: "❓ 说明",
      model_help_title: "📖 模型适用场景说明",
      model_help_header_model: "模型",
      model_help_header_scene: "适用场景",
      model_help_swin_art: "🎨 swin_unet / 插画",
      model_help_swin_art_desc: "二次元/动漫/数字插画 — 动漫截图、Pixiv 插画、数字绘画、游戏 CG、线稿上色图",
      model_help_swin_art_scan: "🖨 swin_unet / 扫描插画",
      model_help_swin_art_scan_desc: "扫描版二次元作品 — 同人志扫描件、杂志扫描图、手绘稿扫描件（带纸张纹理/网点）",
      model_help_swin_photo: "📷 swin_unet / 照片",
      model_help_swin_photo_desc: "真实照片/写实图像 — 摄影作品、风景照、人像、真实世界图像",
      model_help_cunet_art: "🎨 cunet / 插画",
      model_help_cunet_art_desc: "二次元（旧架构） — 与插画模型类似，但使用较早的 CUNet 网络架构，线条锐化风格略有不同",
      close_btn: "关闭"
    },
    en: {
      title: "Unlimited Waifu2x", subhead: "⚡ Browser-side anime upscaling · Fully local",
      src_label: "🖼️ Original", dest_label: "✨ Output", file_emoji_label: "📂 File", drag_text: "drag",
      model_label: "🧠 Model", noise_label: "🌀 Noise Reduction", scale_label: "🔍 Scale", tile_label: "🧩 Tile",
      tta_label: "🔄 TTA", alpha_label: "🎭 Alpha",
      model_swin_art: "🎨 swin_unet / Illustration", model_swin_art_scan: "🖨 swin_unet / Scanned",
      model_swin_photo: "📷 swin_unet / Photo", model_cunet_art: "🎨 cunet / Illustration",
      noise_none: "(-) None", noise_low: "(0) Low", noise_med: "(1) Medium", noise_high: "(2) High", noise_highest: "(3) Highest",
      scale_1: "1x", scale_2: "2x", scale_4: "4x", tile_random: "Random order", tta_integrated: "integrated",
      alpha_auto: "Auto", alpha_disable: "Disabled", start_btn: "Start", stop_btn: "Stop",
      message_ready: "( ・∀・) Ready", scale_comment: "4x not supported", tile_comment: "256 recommended",
      footer_based: "Based on", footer_link: "nunif/waifu2x/unlimited_waifu2x code", footer_privacy: "Privacy Policy",
      model_help_btn: "❓ Info",
      model_help_title: "📖 Model Usage Guide",
      model_help_header_model: "Model",
      model_help_header_scene: "Applicable Scenes",
      model_help_swin_art: "🎨 swin_unet / Illustration",
      model_help_swin_art_desc: "Anime/Digital art — Anime screenshots, Pixiv illustrations, digital paintings, game CG, line art",
      model_help_swin_art_scan: "🖨 swin_unet / Scanned Illustration",
      model_help_swin_art_scan_desc: "Scanned anime works — Doujinshi scans, magazine scans, hand-drawn scans (with paper texture/halftone)",
      model_help_swin_photo: "📷 swin_unet / Photo",
      model_help_swin_photo_desc: "Real photos/realistic images — Photography, landscapes, portraits, real-world images",
      model_help_cunet_art: "🎨 cunet / Illustration",
      model_help_cunet_art_desc: "Anime (legacy architecture) — Similar to illustration model but uses older CUNet, different line sharpening style",
      close_btn: "Close"
    }
  };

  let currentLang = 'zh';
  function switchLang(lang) {
    if (!i18n[lang]) return;
    currentLang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (i18n[lang][key]) {
        if (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) el.value = i18n[lang][key];
        else el.textContent = i18n[lang][key];
      }
    });
    document.querySelectorAll('.lang-switch button').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });
  }

  function openExternalUrl(url) { window.open(url, '_blank', 'noopener noreferrer'); }
  if (typeof window.downloadFile === 'undefined') {
    window.downloadFile = function(source, suggestedName) {
      try {
        let finalName = suggestedName || `download_${Date.now()}.png`;
        const processBlob = (blobData) => {
          const url = URL.createObjectURL(blobData);
          const a = document.createElement('a');
          a.href = url;
          a.download = finalName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };
        if (source instanceof Blob) processBlob(source);
        else if (typeof source === 'string' && (source.startsWith('blob:') || source.startsWith('data:'))) {
          const a = document.createElement('a');
          a.href = source;
          a.download = finalName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } else if (typeof source === 'string') fetch(source, { cache: 'no-store' }).then(res => res.blob()).then(processBlob).catch(()=>{});
      } catch(e) {}
    };
  }

  (function fixFooterLink() {
    const githubLink = document.getElementById('external-github-link');
    if(githubLink) {
      const newLink = githubLink.cloneNode(true);
      githubLink.parentNode.replaceChild(newLink, githubLink);
      newLink.addEventListener('click', (e) => { e.preventDefault(); openExternalUrl(newLink.href); });
    }
    const privacyLink = document.querySelector('#footer a[href="privacy_policy.md"]');
    if(privacyLink) privacyLink.addEventListener('click', (e) => { e.preventDefault(); openExternalUrl(privacyLink.href); });
  })();

  function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
  function showModelHelpModal() {
    const existingModal = document.querySelector('.model-help-modal');
    if (existingModal) existingModal.remove();
    const lang = currentLang;
    const rows = [
      { name: i18n[lang].model_help_swin_art, desc: i18n[lang].model_help_swin_art_desc },
      { name: i18n[lang].model_help_swin_art_scan, desc: i18n[lang].model_help_swin_art_scan_desc },
      { name: i18n[lang].model_help_swin_photo, desc: i18n[lang].model_help_swin_photo_desc },
      { name: i18n[lang].model_help_cunet_art, desc: i18n[lang].model_help_cunet_art_desc }
    ];
    let tableHtml = `<table class="model-help-table"><thead><tr><th>${escapeHtml(i18n[lang].model_help_header_model)}</th><th>${escapeHtml(i18n[lang].model_help_header_scene)}</th></tr></thead><tbody>`;
    rows.forEach(row => { tableHtml += `<tr><td>${escapeHtml(row.name)}</td><td>${escapeHtml(row.desc)}</td></tr>`; });
    tableHtml += `</tbody></table>`;
    const overlay = document.createElement('div');
    overlay.className = 'model-help-modal';
    overlay.innerHTML = `<div class="model-help-card"><div class="modal-header">${escapeHtml(i18n[lang].model_help_title)}</div><div class="modal-body">${tableHtml}</div><div class="modal-actions"><div class="modal-action-bottom"><button id="modalHelpCloseBtn">${escapeHtml(i18n[lang].close_btn)}</button></div></div></div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#modalHelpCloseBtn').onclick = () => overlay.remove();
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  }

  (function fixProgressBar() {
    const progressBar = document.getElementById('progress-bar');
    if (!progressBar) return;
    progressBar.style.display = 'none';
    let progressInterval = null;
    function showProgress() { if (progressBar.style.display !== 'block') { progressBar.style.display = 'block'; progressBar.value = 0; } if (progressInterval) clearInterval(progressInterval); progressInterval = setInterval(()=>{},800); }
    function hideProgress() { if (progressInterval) clearInterval(progressInterval); progressBar.style.display = 'none'; progressBar.value = 0; }
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    if(startBtn) startBtn.addEventListener('click', showProgress);
    if(stopBtn) stopBtn.addEventListener('click', hideProgress);
    const originalSetProgress = window.setProgress;
    window.setProgress = function(percent) { 
      if(originalSetProgress) originalSetProgress(percent); 
      if(progressBar && typeof percent === 'number') { 
        if(progressBar.style.display !== 'block') showProgress(); 
        progressBar.value = Math.min(100, Math.max(0, percent)); 
        if(percent >= 100) setTimeout(hideProgress,800); 
      } 
    };
    window.addEventListener('waifu2x-progress', (e) => { if(e.detail?.progress) window.setProgress(e.detail.progress); });
    const msgDiv = document.getElementById('message');
    if(msgDiv) new MutationObserver(() => { if(msgDiv.innerText.toLowerCase().includes('complete')||msgDiv.innerText.includes('完成')) setTimeout(hideProgress,300); }).observe(msgDiv, { childList: true, subtree: true, characterData: true });
  })();

  const fileInput = document.getElementById('file');
  const srcImg = document.getElementById('src');
  if(srcImg && fileInput) {
    srcImg.addEventListener('dragover', (e) => e.preventDefault());
    srcImg.addEventListener('drop', (e) => {
      e.preventDefault();
      const dt = e.dataTransfer;
      if(dt.files && dt.files.length) {
        fileInput.files = dt.files;
        const changeEvent = new Event('change', { bubbles: true });
        fileInput.dispatchEvent(changeEvent);
      }
    });
  }

  const helpBtn = document.getElementById('modelHelpBtn');
  if (helpBtn) {
    const newHelpBtn = helpBtn.cloneNode(true);
    helpBtn.parentNode.replaceChild(newHelpBtn, helpBtn);
    newHelpBtn.addEventListener('click', (e) => { e.preventDefault(); showModelHelpModal(); });
  }

  document.addEventListener('DOMContentLoaded', () => switchLang('zh'));
  if (document.getElementById('lang-zh')) document.getElementById('lang-zh').addEventListener('click', () => switchLang('zh'));
  if (document.getElementById('lang-en')) document.getElementById('lang-en').addEventListener('click', () => switchLang('en'));
  if (typeof window.saveAsBlob === 'undefined') window.saveAsBlob = function(blob, filename) { window.downloadFile(blob, filename); };
  delete window.showServiceModal;
  if (sessionStorage.getItem('waifu2x_service_modal_shown')) sessionStorage.removeItem('waifu2x_service_modal_shown');
</script>

<!-- Service Worker 注册（PWA 安装提示） -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./service-worker.js').then(function(registration) {
        console.log('Service Worker 注册成功，作用域: ', registration.scope);
      }).catch(function(error) {
        console.error('Service Worker 注册失败: ', error);
      });
    });
  }
</script>
</body>
</html>
